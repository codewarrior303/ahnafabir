<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#34D399" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="#0A0F0D" stroke="#1C2923" stroke-width="4" />
  <rect x="32" y="32" width="448" height="448" rx="96" fill="none" stroke="url(#emeraldGrad)" stroke-width="5" />
  
  <!-- Stylized Geometric "A" Monogram -->
  <!-- Left Leg -->
  <polygon points="256,100 280,100 180,400 130,400" fill="url(#emeraldGrad)" filter="url(#glow)" />
  <!-- Right Leg -->
  <polygon points="256,100 232,100 332,400 382,400" fill="#E2E8E4" />
  <!-- Crossbar -->
  <polygon points="175,290 337,290 322,326 190,326" fill="url(#emeraldGrad)" />
  <!-- Inner Triangle Cutout -->
  <polygon points="256,175 298,265 214,265" fill="#0A0F0D" />
  <!-- Terminal Dot Accent -->
  <circle cx="384" cy="124" r="14" fill="#34D399" filter="url(#glow)" />
</svg>
